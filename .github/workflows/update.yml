# Refreshes the Industry Market Watch every morning: downloads new FRED data,
# re-runs forecasts and backtests, checks the numbers, rebuilds the pages and
# commits the result. GitHub Pages then republishes the site.
name: Update industry data

on:
  schedule:
    - cron: "37 14 * * *"     # daily 14:37 UTC, 20 min after the original Market Watch
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download latest data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_data.py
      - name: Forecasts, backtests, lead/lag
        run: python analyze.py
      - name: Independent check of computed numbers
        run: python verify_calcs.py
      - name: Build pages
        run: python build.py
      - name: Commit changes
        run: |
          git config user.name "market-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data index.html */index.html
          git diff --cached --quiet || git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git push
