<style>
/* Layout: one 1240px column; summary strip, then dense master tables, then analyst tools. Matches the Market Watch palette. */
:root {
  --bg: #f6f5f2; --surface: #fcfcfb; --border: #e3e1db; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #6f6e69;
  --accent: #2a78d6; --accent-soft: rgba(42,120,214,.14);
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --neutral: #8a8984;
  --good-ink: #006300; --warn-ink: #8a5a00; --crit-ink: #a52222; --neutral-ink: #52514e;
  --pos: 208, 59, 59; --neg: 12, 120, 12;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #33332f; --grid: #2a2a27;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #9a998f; --accent: #5a9cec; --accent-soft: rgba(90,156,236,.18);
    --neutral: #8f8e86; --good-ink: #4cc94c; --warn-ink: #fab219; --crit-ink: #f07a7a; --neutral-ink: #c3c2b7;
    --pos: 240, 110, 110; --neg: 76, 201, 76;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #33332f; --grid: #2a2a27;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #9a998f; --accent: #5a9cec; --accent-soft: rgba(90,156,236,.18);
  --neutral: #8f8e86; --good-ink: #4cc94c; --warn-ink: #fab219; --crit-ink: #f07a7a; --neutral-ink: #c3c2b7;
  --pos: 240, 110, 110; --neg: 76, 201, 76;
}
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--font);
  padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-x: clip; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-size: clamp(24px, 3.2vw, 30px); line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.015em; text-wrap: balance; }
h2 { font-size: 16px; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sub { color: var(--text-2); max-width: 75ch; }
.note { color: var(--text-3); font-size: 12.5px; }
.crumb { font-size: 13px; }
.home { max-width: 1240px; margin: 0 auto 16px; }
.home a { font-weight: 700; font-size: 15px; color: var(--text); text-decoration: none; }
.home a:hover { color: var(--accent); }
.top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-2); border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 10px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { padding: 12px 14px; }
.kpi .k { font-size: 12px; color: var(--text-3); }
.kpi .n { font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .d { font-size: 12px; color: var(--text-2); }
.sig { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.sig .ic { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; color: #fff; font-weight: 700; }
.sig.Alert { color: var(--crit-ink); } .sig.Alert .ic { background: var(--crit); }
.sig.Watch { color: var(--warn-ink); } .sig.Watch .ic { background: var(--warn); color: #3a2a00; }
.sig.Stable { color: var(--neutral-ink); } .sig.Stable .ic { background: var(--neutral); }
.sig.Opportunity { color: var(--good-ink); } .sig.Opportunity .ic { background: var(--good); }
.mix { display: inline-flex; gap: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mix span { display: inline-flex; align-items: center; gap: 3px; }
.mix i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.up { color: var(--crit-ink); } .dn { color: var(--good-ink); } .fl { color: var(--text-2); }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.t th, .t td { padding: 7px 8px; border-bottom: 1px solid var(--grid); text-align: right; white-space: nowrap; vertical-align: middle; }
.t th { color: var(--text-2); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); }
.t th.l, .t td.l { text-align: left; }
.t td.wrap-ok { white-space: normal; min-width: 180px; }
.t th[data-sort] { cursor: pointer; user-select: none; }
.t th[data-sort]::after { content: " ↕"; color: var(--text-3); font-weight: 400; }
.t th[aria-sort="ascending"]::after { content: " ↑"; color: var(--accent); }
.t th[aria-sort="descending"]::after { content: " ↓"; color: var(--accent); }
.t tbody tr.click { cursor: pointer; }
.t tbody tr.click:hover, .t tbody tr.sel { background: var(--accent-soft); }
.t .nm { font-weight: 600; }
.t .id { color: var(--text-3); font-size: 11.5px; }
.t .rng { color: var(--text-3); font-size: 11.5px; }
.t .better { color: var(--good-ink); font-weight: 600; }
.spark svg { display: block; width: 96px; height: 24px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 12.5px; cursor: pointer; min-height: 30px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
input[type=search], input[type=number], select { font: inherit; font-size: 13px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; min-height: 32px; }
input[type=search] { width: 220px; max-width: 100%; }
.acts { display: grid; gap: 0; }
.act { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 14px; padding: 9px 0; border-top: 1px solid var(--grid); }
.act:first-child { border-top: 0; }
.act span { color: var(--text-2); }
@media (max-width: 600px) { .act { grid-template-columns: 1fr; } }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--text-2); font: inherit; font-size: 12.5px; padding: 6px 11px; cursor: pointer; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.fig { position: relative; height: 320px; }
.fig svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fig text { fill: var(--text-2); font-size: 11px; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); opacity: 0; white-space: nowrap; z-index: 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 5px; }
.legend i.dash { border-top-style: dashed; }
.legend i.band { height: 10px; border: 0; background: var(--accent-soft); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.facts div { border-top: 1px solid var(--grid); padding-top: 7px; }
.facts .k { font-size: 12px; color: var(--text-3); }
.facts .v { font-weight: 500; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.calc { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .calc { grid-template-columns: 1fr; } }
.calc .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.calc label { font-size: 12.5px; color: var(--text-2); display: grid; gap: 3px; }
.comp { display: grid; grid-template-columns: minmax(0, 1fr) 84px 32px; gap: 6px; align-items: center; }
.comp select { width: 100%; }
.comp button, .btn { font: inherit; font-size: 12.5px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 6px; min-height: 32px; cursor: pointer; padding: 4px 10px; }
.out { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: grid; gap: 8px; }
.out .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
.out table { width: 100%; }
.formula { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--text-2); overflow-x: auto; white-space: nowrap; }
.method p { color: var(--text-2); max-width: 95ch; }
.method ul { margin: 0; padding-left: 18px; color: var(--text-2); }
.method li { margin: 3px 0; }
.heat td.c { min-width: 52px; text-align: center; }
.heat th.rot { white-space: normal; min-width: 52px; max-width: 80px; font-size: 11px; text-align: center; vertical-align: bottom; }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.hs h3 { font-size: 14px; margin: 0 0 2px; }
.hs .note b { color: var(--text-2); }
.bar { display: inline-block; height: 8px; border-radius: 2px; background: var(--accent); vertical-align: middle; }
.flag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.flag.hi { color: var(--crit-ink); border-color: var(--crit); }
.flag.mid { color: var(--warn-ink); border-color: var(--warn); }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.strip .kpi .n { font-size: 22px; }
.fed svg { display: block; width: 100%; max-width: 460px; height: auto; overflow: visible; }
.fed text { fill: var(--text-3); font-size: 10.5px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

/* sortable tables: header cells carry data-sort="key"; rows are re-rendered by the caller */
function sortable(table, rows, render, initial) {
  let key = initial[0], dir = initial[1];
  const go = () => {
    const sorted = [...rows].sort((a, b) => {
      const x = a.sort[key], y = b.sort[key];
      if (x === y) return 0; if (x === null || x === undefined) return 1; if (y === null || y === undefined) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
    });
    table.querySelectorAll("th[data-sort]").forEach(th => th.setAttribute("aria-sort", th.dataset.sort === key ? (dir > 0 ? "ascending" : "descending") : "none"));
    render(sorted);
  };
  table.querySelector("thead").addEventListener("click", e => {
    const th = e.target.closest("th[data-sort]"); if (!th) return;
    if (th.dataset.sort === key) dir = -dir; else { key = th.dataset.sort; dir = th.dataset.first === "asc" ? 1 : -1; }
    go();
  });
  go();
  return { refresh: r => { rows = r; go(); } };
}

const methodHTML = ids => `
  <div class="card method" id="method">
    <h2>Method and sources</h2>
    <p><b>Cost impact.</b> Every series is converted to what it means for a US buyer: for prices, a rise is a cost increase; for currencies quoted as foreign units per dollar, a rise is a stronger dollar and cheaper imports, so the sign flips (USD per euro keeps its sign). Industry figures are the <b>median</b> driver, so one volatile input such as jet fuel cannot dominate.</p>
    <div class="scroll"><table class="t"><thead><tr><th class="l">Group</th><th class="l">Alert</th><th class="l">Watch</th><th class="l">Opportunity</th></tr></thead><tbody>

    </tbody></table></div>
    <p><b>Forecasts.</b> Each series gets a damped-trend exponential smoothing model on log prices (Gardner and McKenzie, 1985; Hyndman and Athanasopoulos, <i>Forecasting: Principles and Practice</i>, 3rd ed., ch. 8). It is tested against the naive forecast (no change from the latest value) in a rolling-origin backtest (Tashman, 2000): the model is refit every month since December 2020 and scored on what actually happened 1 to 6 months later, using mean absolute percentage error (MAPE) from January 2022. Where the naive forecast was more accurate, the page publishes the naive forecast, which is common for commodity prices and exchange rates (Meese and Rogoff, 1983).</p>
    <p><b>Ranges.</b> The 80% range is the 10th to 90th percentile of the chosen method's past errors at each horizon (Williams and Goodman, 1971). "Hit rate" tests it honestly: for each month since January 2023, the range is rebuilt from errors known at the time and checked against the actual outcome. A well-calibrated range hits about 80%.</p>
    <p><b>Lead/lag and correlation.</b> Lead/lag compares monthly log changes of one driver with another 0 to 6 months later and lists pairs where a lagged correlation beats the same-month one and clears a rough significance screen of |r| &gt; 2/√n. Correlations use 12-month % changes since January 2019. Both describe history, not cause and effect.</p>
    <p><b>Data handling.</b> Daily and weekly series (exchange rates, crude oil, jet fuel, diesel) are averaged to monthly. IMF commodity prices are released about a month after BLS data. October 2025 is missing for two BLS consumer price series because collection stopped during the federal government shutdown; that month is interpolated for calculations and left blank in charts. Every value was cross-checked against FRED's own annual and quarterly averages.</p>

function fedBlock(n) {
  const W = 320, H = 120, m = { l: 4, r: 4, t: 8, b: 18 }, rows = n.monthly, mx = Math.max(...rows.map(r => r[1])) || 1, bw = (W - m.l - m.r) / rows.length;
  const bars = rows.map((r, i) => { const h = r[1] / mx * (H - m.t - m.b);
    return `<rect x="${(m.l + i * bw + 1).toFixed(1)}" y="${(H - m.b - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" fill="var(--accent)" opacity="${r[2] ? 0.3 : 0.85}"><title>${mLabel(r[0])}: ${bn(r[1])}${r[2] ? " (still being reported)" : ""}</title></rect>`; }).join("");
  const ticks = rows.map((r, i) => r[0].endsWith("-01") ? `<text x="${(m.l + i * bw).toFixed(1)}" y="${H - 4}">${r[0].slice(0, 4)}</text>` : "").join("");
  return `<div class="hs fed"><h3>NAICS ${esc(n.code)} · ${esc(n.label)}</h3>
    <p class="note"><b>${bn(n.t12)}</b> obligated, ${mLabel(n.window[0])}–${mLabel(n.window[1])} · <span class="${n.yoy > 0 ? "up" : n.yoy < 0 ? "dn" : "fl"}">${pct(n.yoy)}</span> vs prior 12 mo</p>

}

    <div class="head"><h2>Price escalation calculator</h2><span class="note">Index-linked price adjustment, the formula used in most escalation clauses</span></div>
    <div class="calc">
      <div style="display:grid;gap:12px">
        <div class="row">
          <label for="e-base">Base price ($)<input type="number" id="e-base" value="100000" min="0" step="100" style="width:140px"></label>
          <label for="e-from">Base month<select id="e-from"></select></label>
          <label for="e-to">Adjust to<select id="e-to"></select></label>
        </div>
        <div style="display:grid;gap:6px" id="e-comps"></div>
        <div class="row"><button class="btn" id="e-add" type="button">Add cost component</button><span class="note" id="e-fixed"></span></div>
      </div>
      <div class="out" id="e-out" aria-live="polite"></div>
    </div>
  </div>
  <div class="two">
    <div class="card"><div class="head"><h2>Lead/lag</h2><span class="note">Monthly changes, 2018 on</span></div><div id="ll"></div></div>
    <div class="card"><div class="head"><h2>Correlation of 12-mo changes</h2><span class="note">Since Jan 2019</span></div><div class="scroll" id="corr"></div></div>
  </div>
  ${methodHTML(d.series)}`;

  /* driver table */
  let selId = S.slice().sort((a, b) => (b.cost_change.m3 ?? -99) - (a.cost_change.m3 ?? -99))[0].id, range = 48;
  const tb = document.querySelector("#drv tbody");
  const rows = S.map(s => ({ s, sort: { name: s.name, sigr: 4 - ORDER.indexOf(s.signal), latest_month: s.latest_month, m1: s.cost_change.m1, m3: s.cost_change.m3, m12: s.cost_change.m12, f6: s.forecast_6m_cost, mape: s.backtest[s.backtest.chosen].h3, hit: s.backtest.coverage80.h3, dw: LT[s.id] ? LT[s.id].vs_prev_month * s.direction : null } }));
  sortable(document.getElementById("drv"), rows, r => {
    tb.innerHTML = r.map(({ s }) => {
      const b = s.backtest, f = s.forecast[5], ch = b.chosen, beat = ch === "ets";
      return `<tr class="click${s.id === selId ? " sel" : ""}" tabindex="0" data-id="${s.id}">
        <td class="l"><span class="nm">${esc(s.name)}</span><br><span class="id">${esc(s.id)} · ${esc(s.group)}</span></td>
        <td class="l">${sig(s.signal)}</td>
        <td>${fmt(s, s.latest)}<br><span class="rng">${mLabel(s.latest_month)}</span></td>
        ${hasLatest ? (LT[s.id] ? `<td>${fmt(s, LT[s.id].latest)} <span class="rng">${dLabel(LT[s.id].latest_date)}</span><br><span class="${cls(LT[s.id].vs_prev_month === null ? null : LT[s.id].vs_prev_month * s.direction)}">${pct(LT[s.id].vs_prev_month)}</span> <span class="rng">vs ${mLabel(LT[s.id].prev_month)} avg</span></td>` : `<td class="fl">—</td>`) : ""}
        ${["m1", "m3", "m12"].map(k => `<td class="${cls(s.cost_change[k])}">${pct(s.change[k])}</td>`).join("")}
        <td>${beat ? `<span class="${cls(s.forecast_6m_cost)}">${fmt(s, f.mid)} (${pct(s.forecast_6m_pct)})</span>` : `<span class="fl">${fmt(s, f.mid)} (flat)</span>`}<br><span class="rng">${fmt(s, f.lo)} – ${fmt(s, f.hi)} by ${mLabel(f.month)}</span></td>
        <td><span class="${beat ? "better" : ""}">${b[ch].h3.toFixed(1)}%</span><br><span class="rng">${beat ? "model; naive " + b.naive.h3.toFixed(1) + "%" : "naive; model " + b.ets.h3.toFixed(1) + "%"}</span></td>
        <td>${b.coverage80.h3 === null ? "—" : b.coverage80.h3.toFixed(0) + "%"}<br><span class="rng">${b.coverage80.n3} tests</span></td>
        <td class="l">${spark(s)}</td></tr>`;
    }).join("");
  }, ["sigr", -1]);
  const pick = id => { selId = id; tb.querySelectorAll("tr").forEach(tr => tr.classList.toggle("sel", tr.dataset.id === id)); chart(); };
  tb.addEventListener("click", e => { const tr = e.target.closest("tr[data-id]"); if (tr) { pick(tr.dataset.id); document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "nearest" }); } });
  tb.addEventListener("keydown", e => { const tr = e.target.closest("tr[data-id]"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(tr.dataset.id); } });
  document.getElementById("range").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; range = +b.dataset.r;
    document.querySelectorAll("#range button").forEach(x => x.setAttribute("aria-pressed", x === b)); chart(); });

  function chart() {
    const s = D.series[selId], b = s.backtest;
    document.getElementById("d-name").innerHTML = `${esc(s.name)} &nbsp;${sig(s.signal)}`;
    document.getElementById("d-sub").textContent = `${unitLbl(s)} · ${s.publisher}`;
    const hist = s.series.slice(-range - 1), fc = s.forecast;
    const pts = [...hist.map(p => ({ m: p[0], v: p[1] })), ...fc.map(f => ({ m: f.month, f }))];
    const box = document.getElementById("fig"), W = box.clientWidth, H = box.clientHeight, narrow = W < 520;
    const m = { l: 54, r: 14, t: 12, b: 26 };
    const vals = [...hist.map(p => p[1]).filter(v => v !== null), ...fc.flatMap(f => [f.lo, f.hi])];
    let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const n = pts.length, x = i => m.l + i / (n - 1) * (W - m.l - m.r), y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
    let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.name)} history and 6-month forecast">`;
    for (let i = 0; i <= 5; i++) { const v = lo + (hi - lo) * i / 5;
      g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(s, v)}</text>`; }
    const step = Math.ceil(n / (narrow ? 4 : 9));
    pts.forEach((p, i) => { if (i % step === 0 && n - 1 - i >= step * 0.6 || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === n - 1 ? "end" : "middle"}">${mLabel(p.m)}</text>`; });
    const h0 = hist.length - 1;
    g += `<line x1="${x(h0)}" x2="${x(h0)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--border)"/>`;
    const lastV = hist[h0][1];
    const band = [[h0, lastV, lastV], ...fc.map((f, k) => [h0 + 1 + k, f.lo, f.hi])];
    g += `<path d="${band.map((p, i) => (i ? "L" : "M") + x(p[0]).toFixed(1) + "," + y(p[2]).toFixed(1)).join("")}${band.slice().reverse().map(p => "L" + x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join("")}Z" fill="var(--accent-soft)" stroke="none"/>`;
    let d1 = "", pen = false;
    hist.forEach((p, i) => { if (p[1] === null) { pen = false; return; } d1 += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(p[1]).toFixed(1); pen = true; });
    g += `<path d="${d1}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
    g += `<path d="M${x(h0)},${y(lastV)}${fc.map((f, k) => "L" + x(h0 + 1 + k).toFixed(1) + "," + y(f.mid).toFixed(1)).join("")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
    g += `<circle cx="${x(h0)}" cy="${y(lastV)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    g += `<line id="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-3)" stroke-dasharray="3 3" opacity="0"/><rect id="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip" id="tip"></div>`;
    box.innerHTML = g;
    const svg = box.querySelector("svg"), tip = box.querySelector("#tip"), xh = svg.querySelector("#xh");
    svg.querySelector("#hit").addEventListener("pointermove", e => {
      const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.round((e.clientX - r.left - m.l) / (W - m.l - m.r) * (n - 1))));
      const p = pts[i]; xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", 1);
      if (p.f) tip.innerHTML = `<b>${mLabel(p.m, true)} forecast</b><br>${fmt(s, p.f.mid)} · 80% range ${fmt(s, p.f.lo)}–${fmt(s, p.f.hi)}`;
      else { const j = s.series.findIndex(q => q[0] === p.m), prev = s.series[j - 12];
        tip.innerHTML = `<b>${mLabel(p.m, true)}</b><br>${p.v === null ? "Not published" : fmt(s, p.v)}${p.v !== null && prev && prev[1] ? ` · ${pct((p.v / prev[1] - 1) * 100)} vs. year before` : ""}`; }
      tip.style.opacity = 1;
      tip.style.left = Math.max(0, Math.min(W - tip.offsetWidth, x(i) + 12)) + "px";
      tip.style.top = "8px";
    });
    svg.querySelector("#hit").addEventListener("pointerleave", () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); });
    const pos = s.range_pct, f6 = fc[5];
    document.getElementById("d-facts").innerHTML = [
      ["Latest", `${fmt(s, s.latest)} (${mLabel(s.latest_month, true)})`],
      ["Range since Jan 2018", `${fmt(s, s.low)} – ${fmt(s, s.high)}; ${pos >= 90 ? "near its high" : pos <= 10 ? "near its low" : pos.toFixed(0) + "% of the way up"}`],
      [`Forecast for ${mLabel(f6.month, true)}`, `${fmt(s, f6.mid)} (${b.chosen === "ets" ? pct(s.forecast_6m_pct) : "flat, naive"}); 80% range ${fmt(s, f6.lo)} – ${fmt(s, f6.hi)}`],
      ["Backtest MAPE, 1 / 3 / 6 mo", `Model ${b.ets.h1.toFixed(1)} / ${b.ets.h3.toFixed(1)} / ${b.ets.h6.toFixed(1)}%<br>Naive ${b.naive.h1.toFixed(1)} / ${b.naive.h3.toFixed(1)} / ${b.naive.h6.toFixed(1)}%`],
      ["80% range hit rate", `${b.coverage80.h3?.toFixed(0) ?? "—"}% at 3 mo, ${b.coverage80.h6?.toFixed(0) ?? "—"}% at 6 mo`],
      ["Source", `<a href="${s.source}" target="_blank" rel="noopener">FRED ${esc(s.id)}</a> · <a href="${s.publisher_url}" target="_blank" rel="noopener">${esc(s.publisher.split(",")[0])}</a>`],
    ].map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  }

  /* escalation calculator */
  const allMonths = [...new Set(S.flatMap(s => s.series.map(p => p[0])))].sort();
  const fMonths = S[0].forecast.map(f => f.month);
  const val = (s, mth) => { const p = s.series.find(q => q[0] === mth); if (p && p[1] !== null) return { v: p[1], est: false };
    const f = s.forecast.find(q => q.month === mth); if (f) return { v: f.mid, lo: f.lo, hi: f.hi, est: true };
    if (p) { const i = s.series.indexOf(p), a = s.series[i - 1], c = s.series[i + 1]; if (a && c && a[1] !== null && c[1] !== null) return { v: (a[1] + c[1]) / 2, est: true }; }
    return null; };
  const last = S.reduce((m, s) => s.latest_month < m ? s.latest_month : m, "9999-99");
  const defFrom = allMonths[allMonths.indexOf(last) - 12] || allMonths[0];
  const opts = (sel, list) => list.map(mm => `<option value="${mm}"${mm === sel ? " selected" : ""}>${mLabel(mm, true)}</option>`).join("");
  document.getElementById("e-from").innerHTML = opts(defFrom, allMonths.filter(mm => mm <= last));
  const toList = [...allMonths.filter(mm => mm <= last), ...new Set(S.flatMap(s => s.forecast.map(f => f.month)).filter(mm => mm > last))].sort();
  document.getElementById("e-to").innerHTML = toList.map(mm => `<option value="${mm}"${mm === last ? " selected" : ""}>${mLabel(mm, true)}${mm > last ? " (forecast)" : ""}</option>`).join("");
  const labor = S.find(s => s.group === "Labor"), mat = S.filter(s => s.group !== "Labor" && s.group !== "Currency");
  let comps = [[mat[0].id, 40], ...(mat[1] ? [[mat[1].id, 20]] : []), ...(labor ? [[labor.id, 25]] : [])];
  const compsEl = document.getElementById("e-comps");
  const drawComps = () => {
    compsEl.innerHTML = `<div class="comp note"><span>Cost component (index)</span><span>Weight %</span><span></span></div>` + comps.map((c, i) => `
      <div class="comp"><select id="e-c${i}" data-i="${i}" aria-label="Component ${i + 1} index">${S.map(s => `<option value="${s.id}"${s.id === c[0] ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <input type="number" id="e-w${i}" data-i="${i}" min="0" max="100" step="1" value="${c[1]}" aria-label="Component ${i + 1} weight percent">
      <button type="button" data-del="${i}" aria-label="Remove component ${i + 1}">✕</button></div>`).join("");
    calc();
  };
  function calc() {
    const P0 = +document.getElementById("e-base").value || 0, a = document.getElementById("e-from").value, z = document.getElementById("e-to").value;
    const wsum = comps.reduce((t, c) => t + (+c[1] || 0), 0), fixed = 100 - wsum;
    document.getElementById("e-fixed").textContent = fixed >= 0 ? `Fixed (non-indexed) share: ${fixed}%` : `Weights add up to ${wsum}%; reduce them to 100% or less.`;
    const out = document.getElementById("e-out");
    if (fixed < 0 || a >= z) { out.innerHTML = `<p class="note">${a >= z ? "Choose an adjust-to month after the base month." : "Weights exceed 100%."}</p>`; return; }
    let factor = fixed / 100, flo = factor, fhi = factor, anyEst = false; const lines = [];
    for (const [id, w] of comps) {
      const s = D.series[id], b0 = val(s, a), b1 = val(s, z);
      if (!b0 || !b1) { lines.push(`<tr><td class="l">${esc(s.name)}</td><td colspan="3" class="note">No value for one of these months</td></tr>`); factor = NaN; continue; }
      anyEst = anyEst || b0.est || b1.est;
      const r = b1.v / b0.v, adj = s.direction < 0 ? 1 / r : r;   // currencies: foreign units per USD fall = cost up
      const rl = (b1.lo ?? b1.v) / b0.v, rh = (b1.hi ?? b1.v) / b0.v;
      factor += w / 100 * adj;
      flo += w / 100 * (s.direction < 0 ? 1 / rh : rl); fhi += w / 100 * (s.direction < 0 ? 1 / rl : rh);
      lines.push(`<tr><td class="l">${esc(s.name)}</td><td>${w}%</td><td class="${cls((adj - 1) * 100)}">${pct((adj - 1) * 100)}</td><td>${P0 ? money(P0 * w / 100 * (adj - 1)) : "—"}</td></tr>`);
    }
    const P1 = P0 * factor, isF = z > last;
    out.innerHTML = isNaN(factor) ? `<table class="t">${lines.join("")}</table>` : `
      <div class="note">Adjusted price, ${mLabel(z, true)}${isF ? " (forecast)" : ""}</div>
      <div class="big">$${Math.round(P1).toLocaleString("en-US")}</div>
      <div class="${cls((factor - 1) * 100)}"><b>${pct((factor - 1) * 100, 2)}</b> vs. base of $${Math.round(P0).toLocaleString("en-US")} (${mLabel(a, true)})</div>
      ${isF ? `<div class="note">If every indexed component lands at its 80% range edge: $${Math.round(P0 * flo).toLocaleString("en-US")} to $${Math.round(P0 * fhi).toLocaleString("en-US")}. Treat as a stress test, since inputs rarely all hit their extremes together.</div>` : ""}
      <div class="scroll"><table class="t"><thead><tr><th class="l">Component</th><th>Weight</th><th>Index change</th><th>$ impact</th></tr></thead><tbody>${lines.join("")}
      <tr><td class="l">Fixed share</td><td>${fixed}%</td><td>0.0%</td><td>$0</td></tr></tbody></table></div>
      <div class="formula">P₁ = P₀ × [ F + Σ wᵢ × Iᵢ(${z}) / Iᵢ(${a}) ]</div>
      ${anyEst ? `<div class="note">Uses a forecast or interpolated value for at least one month.</div>` : ""}`;
  }
  compsEl.addEventListener("change", e => { const i = +e.target.dataset.i; if (e.target.tagName === "SELECT") comps[i][0] = e.target.value; calc(); });
  compsEl.addEventListener("input", e => { if (e.target.type === "number") { comps[+e.target.dataset.i][1] = +e.target.value; calc(); } });
  compsEl.addEventListener("click", e => { const b = e.target.closest("[data-del]"); if (b) { comps.splice(+b.dataset.del, 1); drawComps(); } });
  document.getElementById("e-add").addEventListener("click", () => { if (comps.length < 6) { comps.push([S.find(s => !comps.some(c => c[0] === s.id))?.id || S[0].id, 0]); drawComps(); } });
  ["e-base", "e-from", "e-to"].forEach(id => document.getElementById(id).addEventListener("input", calc));
  drawComps();

  /* lead/lag */
  document.getElementById("ll").innerHTML = d.leadlag.length ? `<div class="scroll"><table class="t"><thead><tr><th class="l">Leads</th><th class="l">Follows</th><th>Lag</th><th>r (lagged)</th><th>r (same month)</th></tr></thead><tbody>
    ${d.leadlag.map(l => `<tr><td class="l">${esc(D.series[l.lead].name)}</td><td class="l">${esc(D.series[l.follow].name)}</td><td>${l.lag} mo</td><td><b>${l.r.toFixed(2)}</b></td><td>${l.r0.toFixed(2)}</td></tr>`).join("")}
    </tbody></table></div><p class="note">Read the first row as: monthly moves in "${esc(D.series[d.leadlag[0].lead].name)}" have tended to show up in "${esc(D.series[d.leadlag[0].follow].name)}" about ${d.leadlag[0].lag} month${d.leadlag[0].lag > 1 ? "s" : ""} later (n = ${d.leadlag[0].n}). Use it as an early-warning hint, not a rule.</p>`
    : `<p class="note">No driver pair showed a lagged relationship stronger than its same-month one and the significance screen.</p>`;

  /* correlation heat table */
  const short = s => s.name.length > 18 ? s.name.slice(0, 16) + "…" : s.name;
  document.getElementById("corr").innerHTML = `<table class="t heat"><thead><tr><th></th>${S.map(s => `<th class="rot" title="${esc(s.name)}">${esc(short(s))}</th>`).join("")}</tr></thead><tbody>
    ${S.map((s, i) => `<tr><th class="l" style="position:static">${esc(short(s))}</th>${d.corr[i].map((r, j) => {
      if (r === null) return `<td class="c">—</td>`;
      const a = i === j ? 0 : Math.min(1, Math.abs(r)) * 0.55, rgb = r >= 0 ? "var(--pos)" : "var(--neg)";
      return `<td class="c" style="background:rgba(${rgb},${a.toFixed(2)})">${i === j ? "" : r.toFixed(2)}</td>`; }).join("")}</tr>`).join("")}
    </tbody></table><p class="note">Red = move together, green = move opposite. Currency signs are as quoted, not cost-adjusted.</p>`;

  new ResizeObserver(() => chart()).observe(document.getElementById("fig"));
  chart();
}

D.page === "hub" ? hub() : industry();
}
</script>
</body>
</html>
